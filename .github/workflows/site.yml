name: Website

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Each job gets only what it needs: npm's packages run in the build, so it has no identity token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Not on forks: they have no Pages, so the run could only fail. Deploying needs this job, so it goes too.
    if: github.repository == 'mtwabpin/kolahal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's Pages settings.
      pages: write
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: site
    steps:
      # The token isn't saved in .git/config, where `pnpm install` and the build could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by packageManager in site/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1: a commit, as a tag can be moved
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Builds the site and checks every internal link (see site/scripts/check-links.mjs).
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
