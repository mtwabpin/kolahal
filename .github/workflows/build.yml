name: Build

# Every push and pull request: the unit tests and both builds (the full APK for GitHub and the
# Google Play bundle). No keys here: the APK is signed with the runner's own debug key and the
# bundle is left unsigned, so these are for checking, not for installing over a release.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
      - '**.org'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit is often pushed more than once: a version branch, then master and its tag at a
  # release. Build it once. A push is skipped when a Release run of the same commit exists (it
  # runs the same tests and builds, and more), or another Build of it runs or passed. A failed or
  # cancelled run doesn't count. Pull requests and manual runs always build.
  once:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      built: ${{ steps.look.outputs.built }}
    steps:
      # When the lookup fails, it builds anyway.
      - id: look
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag pushed with the branch starts its Release run in the same few seconds.
          sleep 10
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > runs.json
          jq -r --argjson me "$GITHUB_RUN_ID" '.workflow_runs[]
            | select(.id != $me and (.status != "completed" or .conclusion == "success"))
            | select((.path | endswith("/release.yml"))
                or ((.path | endswith("/build.yml")) and .event == "push" and .id < $me))
            | .html_url' runs.json > others.txt
          if [ -s others.txt ]; then
            echo "Already built by: $(head -1 others.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: once
    # Runs when [once] was skipped (not a push) or found no other run.
    if: ${{ !cancelled() && needs.once.outputs.built != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The token isn't saved in .git/config, where every later step (Gradle, its plugins) could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # The NDK app/build.gradle.kts pins: without it the native libraries go out unstripped and
      # the Play bundle has no symbols for them.
      - name: The NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/$ndk"

      # Also checks the Gradle wrapper is the published one. v5: v6 brings caching under Gradle's
      # own terms of use rather than the MIT licence.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2: a commit, as a tag can be moved

      - name: Unit tests and builds
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:bundlePlay :app:assemblePlay

      - name: The Play build leaves out what Play's policy rules out
        run: tools/check-play-build.sh

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Keep the builds
        uses: actions/upload-artifact@v7
        with:
          name: kolahal-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/play/app-play.aab
          retention-days: 14
