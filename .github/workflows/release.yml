name: Release

# Push a tag named after the version, such as v0.3.1, and this builds, signs and publishes it:
# - kolahal-X.Y.Z.apk (the full build) and kolahal-X.Y.Z-play.apk (the Play build, for phones where
#   Play Protect blocks the full one), both signed with the release key, and the mapping zip, on a
#   GitHub release whose notes are docs/release/notes/X.Y.Z.md;
# - kolahal-X.Y.Z-play.aab, signed with the upload key, kept with this run for Play Console, and,
#   once the PLAY_ variables are set, uploaded to Google Play on a testing track: a draft, or sent
#   for review with PLAY_SEND_FOR_REVIEW true.
#
# Secrets, in the release environment (tools/make-keys.sh --secrets stores them):
# RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD, and the
# same four for UPLOAD_.
# How it all fits together: docs/release/README.org.
# Variable, optional but recommended: RELEASE_CERT_SHA256, the release key's certificate digest;
# when set, both APKs must carry it, so a release can never go out under another key.
# Variables for the Play upload, without a key (docs/release/google-play.org → Uploads from the
# workflow): PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT; PLAY_TRACK when it isn't alpha;
# PLAY_SEND_FOR_REVIEW true to send it for review instead of leaving a draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # GitHub's identity token for this run, which Google trusts for the Play upload alone.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the signing keys, for a run on a v* tag alone: docs/release/github-actions.org → Who can release.
    environment: release
    steps:
      # The token isn't saved in .git/config, where every later step (Gradle, its plugins) could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # The NDK app/build.gradle.kts pins: without it the native libraries go out unstripped and
      # the Play bundle has no symbols for them.
      - name: The NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/$ndk"

      # v5: v6 brings caching under Gradle's own terms of use rather than the MIT licence.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2: a commit, as a tag can be moved

      - name: Check the tag, the version and the notes
        env:
          PLAY_UPLOAD: ${{ vars.PLAY_WIF_PROVIDER }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but app/build.gradle.kts says versionName $version."
            exit 1
          fi
          if [ ! -s "docs/release/notes/$version.md" ]; then
            echo "::error::docs/release/notes/$version.md is missing; it becomes the release notes."
            exit 1
          fi
          # Missing at the Play upload, the GitHub release would already be out.
          if [ -n "$PLAY_UPLOAD" ] && [ ! -s "docs/release/notes/$version-play.txt" ]; then
            echo "::error::docs/release/notes/$version-play.txt is missing; it becomes the notes on Google Play."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The signing keys aren't set up; run tools/make-keys.sh --secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf %s "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          printf %s "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"

      - name: Unit tests and signed builds
        env:
          KOLAHAL_RELEASE_STORE_FILE: ${{ runner.temp }}/keys/release.jks
          KOLAHAL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KOLAHAL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KOLAHAL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KOLAHAL_UPLOAD_STORE_FILE: ${{ runner.temp }}/keys/upload.jks
          KOLAHAL_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KOLAHAL_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KOLAHAL_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:bundlePlay
          # The Play build again as an APK, signed with the release key like the full one.
          ./gradlew --no-daemon -PplayApk :app:assemblePlay

      - name: The Play build leaves out what Play's policy rules out
        run: tools/check-play-build.sh

      - name: Check the signatures
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # shellcheck disable=SC2012  # build-tools versions are plain numbers
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          # keytool prints AB:CD…, apksigner abcd…: compare without colons, in lower case.
          expected=$(printf %s "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')
          echo "### Signatures" >> "$GITHUB_STEP_SUMMARY"
          # Build-tools 36 prints "Signer #1 certificate SHA-256 digest: …", 37 "V2 Signer: certificate …".
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/play/app-play.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            digest=$(printf %s "$certs" | sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' | head -1)
            if [ -z "$digest" ]; then echo "$certs"; echo "::error::$apk isn't signed."; exit 1; fi
            # Without the release key secrets the build falls back to the debug key: never ship that.
            if printf %s "$certs" | grep -q 'CN=Android Debug'; then echo "::error::$apk is debug-signed."; exit 1; fi
            if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
              echo "::error::$apk is signed with $digest, not the release key $expected."
              exit 1
            fi
            echo "- $(basename "$apk"): \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
          bundle=$(keytool -printcert -jarfile app/build/outputs/bundle/play/app-play.aab)
          if ! printf %s "$bundle" | grep -q '^Owner:'; then echo "::error::The Play bundle isn't signed."; exit 1; fi
          if printf %s "$bundle" | grep -q 'CN=Android Debug'; then echo "::error::The Play bundle is debug-signed; Play refuses it."; exit 1; fi
          echo "- app-play.aab: $(printf %s "$bundle" | sed -n 's/^Owner: //p' | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/kolahal-$VERSION.apk"
          cp app/build/outputs/apk/play/app-play.apk "out/kolahal-$VERSION-play.apk"
          cp app/build/outputs/bundle/play/app-play.aab "out/kolahal-$VERSION-play.aab"
          # R8's names for each build, to read crash traces with retrace.
          (cd app/build/outputs/mapping && zip -qr "$GITHUB_WORKSPACE/out/kolahal-$VERSION-mapping.zip" release play)
          cp "docs/release/notes/$VERSION.md" out/notes.md
          # shellcheck disable=SC2016  # the backticks are Markdown, not a command
          printf '\n\nBoth APKs and the Play bundle are built from `%s`, the commit this tag points to.\n' "${GITHUB_SHA::7}" >> out/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Kolahal $VERSION" --notes-file out/notes.md \
            "out/kolahal-$VERSION.apk" "out/kolahal-$VERSION-play.apk" "out/kolahal-$VERSION-mapping.zip"

      # Tells the Discord server's #releases channel, through its webhook. Skipped while the
      # DISCORD_RELEASES_WEBHOOK secret isn't set. A failed post never stops the release.
      - name: Post to Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_RELEASES_WEBHOOK isn't set; not posted."; exit 0; fi
          page="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          apk="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/kolahal-$VERSION.apk"
          {
            echo "**Kolahal $VERSION is out**"
            # The short notes written for Google Play, when there are some.
            notes="docs/release/notes/$VERSION-play.txt"
            if [ -s "$notes" ]; then echo; cat "$notes"; fi
            echo
            # <…> keeps Discord from adding a preview card under each link.
            echo "Download the APK: <$apk>"
            echo "All changes: <$page>"
          } > out/discord.txt
          # Discord's limit is 2000 characters. No mentions, whatever the notes say.
          jq -n --rawfile text out/discord.txt \
            '{content: ($text | rtrimstr("\n") | .[0:2000]), allowed_mentions: {parse: []}}' > out/discord.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data @out/discord.json "$WEBHOOK" > /dev/null

      # For Play Console (Test and release → a track → Create new release → upload).
      - name: Keep the Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: kolahal-${{ env.VERSION }}-play
          path: |
            out/kolahal-${{ env.VERSION }}-play.aab
            app/build/outputs/mapping/play/mapping.txt
          retention-days: 90

      # Last, so a failed upload leaves the bundle above to upload by hand. A draft to roll out in
      # Play Console, or with PLAY_SEND_FOR_REVIEW true, rolled out and sent for review.
      - name: Upload to Google Play
        if: vars.PLAY_WIF_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != ''
        env:
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_SEND_FOR_REVIEW: ${{ vars.PLAY_SEND_FOR_REVIEW }}
        run: tools/play-upload.sh "out/kolahal-$VERSION-play.aab" "docs/release/notes/$VERSION-play.txt" "$VERSION"
