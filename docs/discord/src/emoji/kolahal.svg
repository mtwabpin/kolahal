<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- kolahal: the website's icon in the theme's colors: the log's bar, two lines and the prompt over a dusk scene (docs/release/graphics/icon-ideas/b-log-over-a-scene.svg). -->
  <clipPath id="plate"><rect x="4" y="4" width="120" height="120" rx="30"/></clipPath>
  <g clip-path="url(#plate)">
    <svg x="4" y="4" width="120" height="120" viewBox="18 18 72 72">
      <rect x="0" y="0" width="108" height="108" fill="{{extra.sky}}"/>
      <circle cx="70" cy="38" r="10" fill="{{dark.warn}}"/>
      <path d="M0 58 L28 48 L48 56 L70 46 L108 58 V108 H0 Z" fill="{{dark.background}}"/>
      <path d="M33 32 V46" fill="none" stroke="{{dark.warn}}" stroke-width="5" stroke-linecap="round"/>
      <rect x="41" y="31.5" width="16" height="6.5" rx="3.25" fill="{{dark.text}}"/>
      <rect x="41" y="41.5" width="10" height="4.5" rx="2.25" fill="{{dark.text}}" fill-opacity="0.6"/>
      <path d="M32 63 L39 69 L32 75" fill="none" stroke="{{dark.accent}}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="63" width="8.5" height="12" rx="2" fill="{{dark.accent}}"/>
    </svg>
  </g>
</svg>
