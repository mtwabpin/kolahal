<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- kolahal_on_it: a wrench, for being worked on. -->
  <defs>
    <mask id="cut-outline"><rect width="128" height="128" fill="#fff"/><rect x="60" y="-10" width="8" height="38" fill="#000"/></mask>
    <mask id="cut"><rect width="128" height="128" fill="#fff"/><rect x="55" y="-10" width="18" height="44" rx="4" fill="#000"/></mask>
  </defs>
  <g transform="rotate(45 64 64)">
    <g mask="url(#cut-outline)" fill="{{dark.background}}">
      <circle cx="64" cy="32" r="31"/>
      <rect x="49" y="44" width="30" height="80" rx="15"/>
    </g>
    <g mask="url(#cut)" fill="{{dark.text}}">
      <circle cx="64" cy="32" r="26"/>
      <rect x="54" y="48" width="20" height="71" rx="10"/>
    </g>
    <circle cx="64" cy="104" r="4.5" fill="{{dark.background}}"/>
  </g>
</svg>
