<!doctype html>
<!-- The still layers of the preview video, one per screenshot: tools/video/compose.mjs opens this
     page in headless Chrome with what to draw as JSON in the address's hash (#{"kind":…}) and a
     window of the layer's size, and shoots it with a transparent background.

     Kinds:
       ground   the scene at the top, fading into the ground's color; wider than the frame, for the pan
       wash     the ground's color behind the captions, so they keep their contrast over the scene
       frame    the phone's frame with its shadow, at the recording's own scale (the screen is empty)
       mask     the screen's round corners: white inside, black outside, at the recording's size
       head     a chapter's label and heading, standing on the bottom edge of the layer
       text     a caption's words, and a small note under them, hanging from the top of the layer
       card     the name, the line under it, and a last line: the opening and the closing
       missing  a stand-in screen for a chapter not yet recorded, in the app theme's colors

     The look is the website's (its tokens, site/src/styles/tokens.css, and its fonts, from the
     site's packages inside this repository: run `pnpm install` in site/ first). The phone's frame
     follows the cover's (.s-frame in site/src/components/Hero.astro), scaled from its 280 px to
     the recording's 1080 px screen. Sizes of text are CSS pixels of a 1920 × 1080 frame; for
     3840 × 2160 the script shoots at twice the pixel density. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolahal video layers</title>
<link rel="stylesheet" href="../../site/src/styles/tokens.css">
<style>
	@font-face {
		font-family: 'Bricolage Grotesque Variable';
		font-weight: 200 800;
		src: url('../../site/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');
	}
	@font-face {
		font-family: 'Instrument Sans Variable';
		font-weight: 400 700;
		src: url('../../site/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2-variations');
	}
	@font-face {
		font-family: 'JetBrains Mono';
		font-weight: 400;
		src: url('../../site/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
	}
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
	body { position: relative; font-family: var(--s-font-text); -webkit-font-smoothing: antialiased; }

	/* The ground: the scene from the top, as wide as the layer, fading into the ground's color. */
	.ground { position: absolute; inset: 0; background: var(--ground); }
	.ground .scene {
		position: absolute;
		inset: 0 0 auto;
		aspect-ratio: 2560 / 1240;
		background: var(--scene) center top / 100% auto no-repeat;
	}
	.ground .scene::after {
		content: '';
		position: absolute;
		inset: 0;
		background: linear-gradient(to bottom, transparent 52%, var(--ground) 97%);
	}
	/* The wash: the website's (Hero.astro, .s-scene::after), mirrored, as the words are on the right. */
	.wash {
		position: absolute;
		inset: 0;
		--wash: color-mix(in srgb, var(--ground) var(--wash-strength, 56%), transparent);
		background: linear-gradient(to left, var(--wash) 0%, var(--wash) 50%, transparent 74%);
	}

	/* The phone, at the recording's scale: 1080 px of screen, 37 px of frame around it. */
	.frame {
		position: absolute;
		left: 200px;
		top: 40px;
		width: 1154px;
		height: 2474px;
		border-radius: 148px;
		border: 4px solid var(--s-phone-edge);
		background: var(--s-phone);
		box-shadow: 0 148px 288px -115px var(--frame-shadow, rgb(0 0 0 / 0.8));
	}
	:root[data-theme='light'] .frame { --frame-shadow: color-mix(in srgb, var(--s-ink) 60%, transparent); }
	.mask { position: absolute; inset: 0; background: #000; }
	.mask div { position: absolute; inset: 0; border-radius: 115px; background: #fff; }

	/* Captions. */
	.head, .text, .card {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		color: var(--s-ink);
	}
	.head { justify-content: flex-end; gap: 16px; }
	.text { justify-content: flex-start; gap: 20px; }
	.card { justify-content: center; gap: 30px; }
	.label {
		font-size: 36px;
		font-weight: 650;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: var(--s-muted);
	}
	h1 {
		font-family: var(--s-font-display);
		font-size: 84px;
		font-weight: 700;
		line-height: 1.02;
		letter-spacing: -0.025em;
		text-wrap: balance;
	}
	.card h1 { font-size: 104px; }
	p {
		font-size: 54px;
		line-height: 1.28;
		color: var(--s-ink-soft);
		text-wrap: pretty;
	}
	.card p { font-size: 56px; }
	.note, .card .line {
		font-size: 38px;
		line-height: 1.3;
		color: var(--s-muted);
	}
	code {
		font-family: var(--s-font-mono);
		font-size: 0.84em;
		padding: 0.04em 0.3em;
		border-radius: 14px;
		background: var(--s-code);
		color: var(--s-on-code);
		box-shadow: inset 0 0 0 1px var(--s-code-rule);
		white-space: nowrap;
	}

	/* A chapter not yet recorded: a plain screen in the app theme's colors. */
	.missing {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: 40px;
		padding: 0 110px;
		background: var(--app-bg);
		color: var(--app-text);
		font-family: var(--s-font-mono);
	}
	.missing h2 { font-size: 84px; font-weight: 400; line-height: 1.2; }
	.missing div { font-size: 52px; color: var(--app-muted); }
	.missing span { white-space: nowrap; }
</style>
</head>
<body>
<script>
	// What to draw: JSON in the hash, written by compose.mjs.
	const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
	const root = document.documentElement;
	if (spec.tokens === 'light') root.dataset.theme = 'light';
	// The ground's color: the theme's page, or the code blocks' color where there is no scene.
	root.style.setProperty('--ground', spec.scene === null && spec.kind !== 'missing' ? 'var(--s-code)' : 'var(--s-ground)');

	const el = (tag, cls, html) => {
		const e = document.createElement(tag);
		if (cls) e.className = cls;
		if (html !== undefined) e.innerHTML = html;
		return e;
	};
	// Caption words: `code` becomes a code chip; everything else is text.
	const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	const words = (s) => escape(s).replace(/`([^`]+)`/g, '<code>$1</code>');

	const body = document.body;
	switch (spec.kind) {
		case 'ground': {
			const g = body.appendChild(el('div', 'ground'));
			if (spec.scene) {
				const s = g.appendChild(el('div', 'scene'));
				s.style.setProperty('--scene', `url('${spec.scene}')`);
			}
			break;
		}
		case 'wash':
			body.appendChild(el('div', 'wash'));
			break;
		case 'frame':
			body.appendChild(el('div', 'frame'));
			break;
		case 'mask':
			body.appendChild(el('div', 'mask')).appendChild(el('div'));
			break;
		case 'head': {
			const h = body.appendChild(el('div', 'head'));
			h.appendChild(el('div', 'label', words(spec.label)));
			h.appendChild(el('h1', '', words(spec.heading)));
			break;
		}
		case 'text': {
			const t = body.appendChild(el('div', 'text'));
			const p = t.appendChild(el('p', '', words(spec.text)));
			if (spec.note) t.appendChild(el('div', 'note', words(spec.note)));
			// At most two lines: a longer caption gets smaller type, down to 46 px.
			// Measured once the font is in.
			document.fonts.load('54px "Instrument Sans Variable"').then(() => {
				for (let size = 54; size > 46 && p.getBoundingClientRect().height > size * 1.28 * 2 + 1; size -= 2)
					p.style.fontSize = size - 2 + 'px';
			});
			break;
		}
		case 'card': {
			const c = body.appendChild(el('div', 'card'));
			c.appendChild(el('h1', '', words(spec.heading)));
			c.appendChild(el('p', '', words(spec.text)));
			if (spec.line) c.appendChild(el('div', 'line', words(spec.line)));
			break;
		}
		case 'missing': {
			root.style.setProperty('--app-bg', spec.colors.background);
			root.style.setProperty('--app-text', spec.colors.text);
			root.style.setProperty('--app-muted', spec.colors.muted);
			const m = body.appendChild(el('div', 'missing'));
			m.appendChild(el('h2', '', escape(spec.title)));
			m.appendChild(el('div', '', 'No recording: <span>' + escape(spec.file) + '</span>'));
			break;
		}
	}
</script>
</body>
</html>
